# Профиль сети станции (спецификации network-profiles и hyprland-autostart,
# docs/amnezia-split-tunnel.md, раздел «Профили сети»): при запасном профиле
# (строка backup в /etc/amnezia/profile) служба не запускается — ни при
# загрузке, ни по systemctl start. Условие даёт состояние inactive
# (Result=exec-condition), а не failed, поэтому очередь загрузки и вход
# не задерживаются. Включение в автозапуск не меняется: источник правды
# о профиле — только файл. Нет файла или в нём не backup — основной профиль.
[Service]
ExecCondition=/bin/sh -c '! grep -sqx backup /etc/amnezia/profile'
