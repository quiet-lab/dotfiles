# Журнал рукопожатий туннеля для значка amn0 в трее панели (состояние
# «поднят, но связи нет», изменение OpenSpec tunnel-country-link).
# amneziawg-go при LOG_LEVEL=verbose оставляет вывод фонового процесса
# в stdout юнита, и строки «Sending handshake initiation», «Handshake did
# not complete after 5 seconds, retrying», «Received handshake response»,
# «Sending/Receiving keepalive packet» попадают в журнал awg-quick@amn0.
# Без модуля ядра awg-quick запускает именно amneziawg-go; с модулем ядра
# этих строк нет, и состояние «связи нет» не определяется.
[Service]
Environment=LOG_LEVEL=verbose
