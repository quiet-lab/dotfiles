# Постоянная настройка (OpenSpec hyprland-config, design D14, 2026-09-10).
# Под KMS при 3840x2160@120 и @98 картинка темнее и шрифты хуже, чем в X11
# при том же канале (RGB, 8 бит); при 60 Гц (RGB, 10 бит) разницы нет.
# Причина: nvidia-drm при каждом modeset безусловно разрешает Adaptive-Sync
# (nvkms-kapi.c, allowAdaptiveSync = ALL), и nvkms переводит монитор
# Philips 558M1R в режим Adaptive-Sync по биту DPCD MSA_TIMING_PAR_IGNORED,
# независимо от VRR_ENABLED; панель в этом режиме меняет гамму. X-драйвер без
# опции AllowGSYNCCompatible этого не делает.
# Параметр скрывает от драйвера возможности VRR монитора: vrr_capable в DRM
# равен 0, Adaptive-Sync не включается, 120 и 60 Гц выглядят одинаково.
# Цена: VRR в Wayland-сессии недоступен вовсе. Чтобы вернуть VRR для игр,
# удалить файл и пересобрать initramfs (limine-mkinitcpio).
options nvidia_modeset conceal_vrr_caps=1
