# Предел размера дампа памяти для всех программ (решение пользователя
# 17.10.2026). По умолчанию systemd-coredump обрезает дамп на 32 ГиБ; при
# массовом падении безоконных Chromium (headless_shell в прогонах Playwright)
# десять таких дампов сжимались одновременно, упирались в срок юнита и
# вызывали OOM, а сами дампы бесполезны: почти весь объём — пустое адресное
# пространство. Обычные программы в 4 ГиБ помещаются целиком.
# Копия файла — system/systemd/coredump.conf.d/ в репозитории chezmoi.
[Coredump]
ProcessSizeMax=4G
ExternalSizeMax=4G
