  "🐈", "🐎", "🐏", "🐐", "🐑", "🐒", "🐕", "🐖", "🐗", "🐘", "🐨", "🐩", "🐪", "🐫", "🐭",
  "🐮", "🐯", "🐰", "🐼", "🐻", "🐺", "🐹", "🐷", "🐶", "🐵", "🐴", "🐱", "🐁", "🐀",
]
