onboarding = false
[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true

status_indicators = "symbols"
[experimental]
kitty_graphics = true

[ui.toast]
delivery = "off"

# Заголовок агента — одна строка: значок состояния и название вкладки
# (подпись вкладки равна подписи workspace).
[ui.sidebar.agents]
rows = [["state_icon", "tab"]]

# Значки состояния агентов (форк duty-herdr): ширина 2 ячейки, без U+FE0F.
[ui.status_icons]
idle = "🟡"
working = "🟢"
blocked = "🔴"
done = "✅"
unknown = "·"

# Заголовок workspace — одна строка: значок состояния и подпись.
# Цвет заголовка задаёт токен метаданных color
# (herdr workspace report-metadata <ws> --source <id> --token color=#hex):
# главная сессия репозитория — белый из хука herdr-session-label.sh,
# задачи duty — из конфига duty.
[ui.sidebar.spaces]
rows = [["state_icon", { token = "workspace", fg = "$color" }]]

[ui.sound]
enabled = false

[theme]
name = "catppuccin"
auto_switch = false

# Восстановление сессии не запускает агентов (claude --resume): решение
# запустить Claude Code принимает пользователь (спецификация
# hyprland-autostart, требование «Предстартовая подготовка herdr»).
[session]
resume_agents_on_restore = false
