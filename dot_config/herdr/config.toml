onboarding = false
[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true

status_indicators = "symbols"
[experimental]
kitty_graphics = true

[ui.toast]
delivery = "off"

# Подпись вкладки агента всегда равна подписи workspace, поэтому токен tab
# из первой строки панели агентов убран (иначе подпись повторяется дважды).
[ui.sidebar.agents]
rows = [["state_icon", "machine", "workspace"], ["agent"]]

[ui.sound]
enabled = false

[theme]
name = "catppuccin"
auto_switch = false

# Восстановление сессии не запускает агентов (claude --resume): решение
# запустить Claude Code принимает пользователь (спецификация
# hyprland-autostart, требование «Предстартовая подготовка herdr»).
[session]
resume_agents_on_restore = false
