onboarding = false
[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true

status_indicators = "symbols"
[experimental]
kitty_graphics = true

[ui.toast]
delivery = "off"

# Заголовок агента — одна строка: значок состояния и подпись вкладки цветом
# токена color workspace, без инверсии. У workspace без токена color подпись
# белая (запасной цвет после «|»).
[ui.sidebar.agents]
rows = [["state_icon", { token = "tab", fg = "$color|#ffffff" }]]

# Полоса вкладок workspace. Активная вкладка — текст цветом токена color
# workspace на фоне панели, неактивные — заливка цветом workspace, текст цветом
# фона панели (инверсия по фокусу). Без токена color заливка белая.
[ui.tab_bar]
active = { fg = "$color|#ffffff", bg = "$panel" }
inactive = { fg = "$panel", bg = "$color|#ffffff" }

# Значки состояния агентов (форк duty-herdr): ширина 2 ячейки, без U+FE0F.
# Список кадров — анимация по кругу, период frame_interval_ms (форк duty-herdr).
# frame_phase per_row — фаза кадра своя у каждой строки; frame_speed_spread — разброс скорости по состояниям.
[ui.status_icons]
idle = "☕"
working = ["🌑", "🌒", "🌓", "🌔", "🌕", "🌖", "🌗", "🌘"]
frame_interval_ms = { working = 83, blocked = 333 }
frame_phase = "per_row"
frame_speed_spread = { working = 0.10 }
blocked = ["🆘", "🚨"]
done = "✅"
unknown = "🗿"

# Форма курсора по строке состояния Claude Code (форк duty-herdr): в режиме
# INSERT редактора vim — черта, иначе блок. Требует CLAUDE_CODE_NATIVE_CURSOR=1
# в ~/.claude/settings.json, иначе Claude Code рисует свой блок поверх.
[ui.cursor_shape_by_screen.claude]
default = "steady_block"
rules = [
  { contains = "-- INSERT --", shape = "steady_bar", bottom_non_empty_lines = 2 },
]

# Символы workspace по каталогам (форк duty-herdr). Источник символов —
# раздел [symbols] файла .duty/duty.toml каждого репозитория (main — корневой
# workspace, tasks — дочерние), вне репозиториев — symbols.outside из
# ~/.config/duty/config.toml. Палитра — scripts/colors.txt плагина duty;
# у проектов своей палитры нет. Токен report-metadata любого источника
# (хук herdr-session-label.sh, dispatch.sh плагина duty) главнее токена herdr.
# Ручная подпись workspace видна только при живом агенте в первой вкладке,
# иначе herdr показывает «<символ> <место> · <приложение>».

