# Заголовок workspace — одна строка: значок состояния и подпись.
# Цвет задаёт токен метаданных color
# (herdr workspace report-metadata <ws> --source <id> --token color=#hex):
# главная сессия репозитория — белый из хука herdr-session-label.sh,
# задачи duty — из dispatch.sh, дочерние workspace без токена duty — из colors.
# Без токена подпись белая (запасной цвет после «|»).
[ui.sidebar.spaces]
rows = [["state_icon", { token = "workspace", fg = "$color|#ffffff" }]]

[ui.sound]
enabled = false

[theme]
name = "catppuccin"
auto_switch = false

# Восстановление сессии не запускает агентов (claude --resume): решение
# запустить Claude Code принимает пользователь (спецификация
# hyprland-autostart, требование «Предстартовая подготовка herdr»).
[session]
resume_agents_on_restore = false
