# Манифест fzf (D6 изменения herdr-keys-help). Внутри открытого fzf таблица статична:
# строится один раз при входе в контекст. Источники по порядку: действия с клавишами по
# умолчанию из `man fzf` (подраздел AVAILABLE ACTIONS: строка «действие, клавиши через
# пробел, пояснение в скобках»), затем привязки `--bind` из переменной FZF_DEFAULT_OPTS
# процесса fzf, которые переопределяют умолчания. Пояснение из скобок man — `desc_full`;
# короткие описания — в правилах [[describe]].

program = "fzf"
priority = 100
origins = ["fzf", "user"]

[detect]
process = ["fzf"]
shell_commands = ["fzf", "fzf *", "fzf-*", "__fzf_*"]

# Режима нет: контекст — просто `fzf` (спецификация, «Контекст и запись таблицы»).

# Клавиши одного действия идут в строке man через пробел (`ctrl-b left`): захват `key`
# берёт их все, `split` делит на отдельные записи, поэтому число клавиш не ограничено.
[[source]]
modes = ["*"]
kind = "regex"
command = ["man", "-P", "cat", "fzf"]
regex = '''^ {9}(?P<action>[a-z][a-z0-9/+-]*(?:\([^)]*\))?) {2,}(?P<key>[^\s(]\S*(?: +[^\s(]\S*)*)(?: +\((?P<desc>.*)\))?$'''
split = ' +'
desc_field = "desc"
origin = "fzf"

[[source]]
modes = ["*"]
kind = "regex"
env = "FZF_DEFAULT_OPTS"
regex = '''(?:--bind[= ]['"]?|,)(?P<key>[^\s,:'"]+):(?P<action>[a-z][a-z0-9+-]*(?:\([^)]*\))?)'''
on_conflict = "override"
origin = "user"

