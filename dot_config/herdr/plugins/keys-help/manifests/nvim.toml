# Манифест Neovim (D6 и D11 изменения herdr-keys-help). Режим и адрес сервера
# (`server`) сообщает модуль dot_config/nvim/lua/keys_help.lua (запись `nvim-<pid>.json`,
# поле `mode` — normal, insert, visual, select, cmdline, replace, terminal, operator).
# Таблица из живого процесса: функция `dump(<режим vim>)` модуля возвращает JSON-массив
# глобальных и буферных привязок (`nvim_get_keymap`, `nvim_buf_get_keymap`) с полями lhs,
# rhs, desc, origin, group, source; запрос идёт через `nvim --server <адрес> --remote-expr`.
# `desc` привязки — полный текст (`desc_full`); короткое описание — он же, если короче 32
# символов, иначе сокращение по правилу D7а (правила [[describe]] не нужны). Без `rhs`
# (привязка с функцией) действием служит `desc`. В `raw` — `rhs` и файл определения
# (`source`). Поверх привязок — базовые клавиши vim (data/vim-basic.toml, короткие
# описания по-русски), записи из процесса сохраняются (`keep`). Режим replace
# использует привязки режима insert.

program = "nvim"
priority = 100
origins = ["user", "lazyvim", "nvim"]

[detect]
provider = "nvim"
process = ["nvim"]
shell_commands = ["nvim", "nvim *", "vi", "vim", "vim *"]

[modes]
default = "normal"

[[source]]
modes = ["normal"]
kind = "json"
command = ["nvim", "--server", "{record.server}", "--remote-expr", "luaeval('require(\"keys_help\").dump(\"n\")')"]
key_field = "lhs"
action_field = "rhs"
desc_field = "desc"
origin_field = "origin"
group_field = "group"
raw_fields = ["rhs", "source"]
skip = { key = '^<Plug>' }

[[source]]
modes = ["insert"]
kind = "json"
command = ["nvim", "--server", "{record.server}", "--remote-expr", "luaeval('require(\"keys_help\").dump(\"i\")')"]
