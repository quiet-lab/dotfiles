# Базовые клавиши vim для манифеста nvim: статическая таблица (в Neovim нет файла
# умолчаний, а nvim_get_keymap отдаёт только заданные привязки). Таблица на режим
# `[<режим>]` с массивом `keymap`: `on` — клавиши через пробел, `run` — не используется
# (в этих записях `action` совпадает с `on`), `desc` — короткое описание, `group` — группа.

[normal]
keymap = [
  { on = "h", run = "h", desc = "символ влево", group = "motion" },
  { on = "j", run = "j", desc = "строка вниз", group = "motion" },
  { on = "k", run = "k", desc = "строка вверх", group = "motion" },
  { on = "l", run = "l", desc = "символ вправо", group = "motion" },
  { on = "w", run = "w", desc = "слово вперёд", group = "motion" },
  { on = "b", run = "b", desc = "слово назад", group = "motion" },
  { on = "e", run = "e", desc = "к концу слова", group = "motion" },
  { on = "W", run = "W", desc = "слово вперёд по пробелам", group = "motion" },
  { on = "B", run = "B", desc = "слово назад по пробелам", group = "motion" },
  { on = "E", run = "E", desc = "к концу слова по пробелам", group = "motion" },
