# Группы по действию: общий порядок — history, completion, edit, motion и другие,
# порядок показа задаёт view.toml.
[[group]]
action = '^vi-command/search-char'
group = "motion"

[[group]]
action = '^vi-command/commandline$'
group = "line"

[[group]]
action = '^(fzf-file-widget|ble/util/eval-stdout .*|tv_smart_autocomplete)$'
group = "tools"

[[group]]
action = 'history|^__atuin_history|^tv_shell_history$|^i\\eh$|^insert-(last|nth)-argument$|^dabbrev-expand$|^magic-(space|slash)$|^(backward|forward)-line history$'
group = "history"

[[group]]
action = '^(vi-command/search-(repeat|reverse-repeat|word-(backward|forward)|backward|forward))$|^(isearch|nsearch)/'
group = "search"

[[group]]
action = 'complete|^menu|^auto|sabbrev'
group = "completion"

[[group]]
action = '^(vi_[nixo]map)/(.*-mode(-.*)?|cancel|exit|switch-to-.*)$|^overwrite-mode$'
group = "mode"

[[group]]
action = 'keyboard-macro|^vi_nmap/(play|record)-register$'
group = "macro"

[[group]]
action = '^(accept|newline$|discard-line$|clear-screen$|redraw-line$|fg$|vi_cmap/|vi-command/(cancel|exit-on-empty-line|:q)$)'
group = "line"

[[group]]
action = 'kill|delete|copy|yank|transpose|case|capitalize|upcase|downcase|quoted-insert|bracketed-paste|undo|redo|revert|repeat|paste|connect-line|crement|operator|insert-comment|expand|tilde|edit-and|universal-arg|replace|zap|^set-mark$|register$'
group = "edit"

[[group]]
action = 'char|word|line|beginning|end|first|last|nth|mark|scroll|page|text-object|vword|uword|sword|cword|eol|exchange|matchpair|visual-area'
group = "motion"

[[group]]
action = '.*'
group = "other"

[[origin]]
type = '^[xcs]$'
action = '^(fzf-|ble/util/eval-stdout "__fzf_|i\\eh$)'
origin = "fzf"

[[origin]]
type = '^[xcs]$'
action = '^__atuin_'
origin = "atuin"

[[origin]]
type = '^[xcs]$'
action = '^tv_'
origin = "tv"

[[origin]]
type = '^[xcs]$'
origin = "user"

[[origin]]
action = '^vi-rlfunc/'
origin = "readline"

[[origin]]
origin = "ble"

# Применимость команд редактирования при позиции курсора в строке ввода (D17):
# применимые поднимаются в раздел «по позиции курсора», остальные приглушаются.

[[applies]]
modes = ["vi_imap", "emacs", "auto_complete"]
action = '^(backward-char|backward-cword|backward-sword|beginning-of-line|non-space-beginning-of-line|transpose-chars|transpose-ewords)$'
when = "col > 0"

[[applies]]
modes = ["vi_imap", "emacs", "auto_complete"]
action = '^(delete-region-or delete-backward-char|vi_imap/delete-region-or vi_imap/delete-backward-indent-or delete-backward-char|delete-backward-cword|kill-backward-cword|kill-backward-line|kill-region-or kill-backward-uword|vi_imap/kill-backward-word|copy-backward-sword|copy-region-or copy-backward-uword)$'
when = "col > 0"

[[applies]]
modes = ["vi_imap", "emacs", "auto_complete"]
action = '^(forward-char|forward-cword|forward-sword|end-of-line)$'
when = "col < line_len"

[[applies]]
modes = ["vi_imap", "emacs", "auto_complete"]
action = '^(delete-region-or delete-forward-char|delete-region-or delete-forward-char-or-exit|delete-forward-cword|kill-forward-cword|kill-forward-line|copy-forward-sword|zap-to-char|delete-horizontal-space|upcase-eword|downcase-eword|capitalize-eword)$'
when = "col < line_len"

[[applies]]
modes = ["vi_imap", "emacs", "auto_complete"]
action = '^(beginning-of-text|history-prev)$'
when = "row > 0"

[[applies]]
modes = ["vi_imap", "emacs", "auto_complete"]
action = '^history-next$'
when = "rows_below > 0"

[[applies]]
modes = ["vi_imap", "emacs", "auto_complete"]
action = '^end-of-text$'
when = "point < len"

# Подсказка автодополнения (keymap auto_complete) принимается только в конце непустой
# строки; есть ли сама подсказка, переменные позиции не сообщают, поэтому условие
# приблизительное.
[[applies]]
modes = ["auto_complete"]
action = '^auto_complete/(@end insert(-cword|-word)?|insert|accept-line)$'
when = "point == len && blank == 0"
