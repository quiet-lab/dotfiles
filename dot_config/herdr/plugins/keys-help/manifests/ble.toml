# Манифест ble.sh (D6 изменения herdr-keys-help): таблица клавиш каждого keymap строится
# из живого дампа `ble-bind -m <keymap> -P`, который пишет модуль keys-help.bash оболочки
# (поле `table` записи панели). Описания виджетов — короткие, по-русски (не длиннее
# 32 символов); имя виджета остаётся в поле `action`, строка дампа — в `raw`.
# Порядок правил `[[describe]]`, `[[group]]`, `[[origin]]` — порядок проверки: побеждает
# первое совпавшее правило.

program = "ble"
priority = 100
origins = ["readline", "ble", "fzf", "atuin", "tv", "user"]

[detect]
provider = "ble"

[modes]
default = "vi_imap"

# Порядок показа по происхождению (D15): сначала клавиши atuin, television и fzf,
# доступные из оболочки, затем остальное.
[view]
origin_order = ["atuin", "tv", "fzf", "user"]

[[source]]
modes = ["*"]
kind = "regex"
file = "{record.table}"
# Строка дампа: ble-bind -m 'vi_imap' -f C-a beginning-of-line. Клавиша — слово shell
# (кавычки, обратная косая черта), действие — остаток строки; пустые макросы (-s без
# текста) не совпадают.
regex = '''^ble-bind -m \S+ -(?P<type>[fxcs]) (?P<key>(?:'[^']*'|\\.|[^\s'\\])+) (?P<action>.+)$'''
unquote = ["key", "action"]
# Служебные виджеты (__attach__, __default__ и подобные), ввод символов, цифровые
# аргументы, звонок и пустые действия, внутренние макросы atuin (C-x C-_ …).
# ac_enter — не клавиша клавиатуры, а код, который автодополнение ble.sh само подаёт
# в декодер при вставке предложения (для записи макросов), поэтому в таблицу не идёт.
skip = { key = '^(C-x C-_ |ac_enter$|__\w+__$)', action = '^(bell|nop|self-insert|batch-insert|bracketed-paste|(\S+/)?append-arg|(\S+/)?__\w+__|\S+/bell|\S+/self-insert|\S+/bracketed-paste|__atuin_widget_run \d+|\\C-x\\C-_.*)$' }
on_conflict = "override"


