[[source]]
modes = ["search", "insert", "normal"]
kind = "static"
origin = "atuin"
entries = [
  { key = "C-a d", action = "delete" },
  { key = "C-a D", action = "delete-all" },
  { key = "C-a a", action = "cursor-start" },
