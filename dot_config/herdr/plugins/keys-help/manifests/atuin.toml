# Манифест atuin (D6 изменения herdr-keys-help). Режим берётся из `keymap_mode`
# ~/.config/atuin/config.toml: emacs -> search, vim-insert -> insert, vim-normal ->
# normal; пока ключ не задан (умолчание emacs, значение auto действует как emacs для
# клавиши, вызванной без --keymap-mode) — search. Таблица статична (умолчания atuin
# 18.24.5, исходники crates/atuin/src/command/client/search/keybindings/defaults.rs)
# плюс переопределения пользователя из разделов [keymap.<режим>] конфига (форма `map`:
# ключ — клавиша atuin, значение — действие). Клавиши внутри открытого atuin
# определяются по режиму; вкладка «подробности» (C-o) и префиксный режим C-a описаны
# как отдельные записи («C-a d» и т. п.). Короткие описания — по-русски, полный
# текст — из таблицы действий docs/configuration/advanced-key-binding.md.

program = "atuin"
priority = 100
origins = ["atuin", "user"]

[detect]
process = ["atuin"]
shell_commands = ["atuin *", "__atuin_*"]

[modes]
default = "search"

[modes.from_config]
file = "~/.config/atuin/config.toml"
key = "keymap_mode"
map = { emacs = "search", auto = "search", vim-insert = "insert", vim-normal = "normal" }

[[source]]
modes = ["search", "insert"]
kind = "static"
origin = "atuin"
entries = [
  { key = "C-c", action = "return-original" },
  { key = "C-g", action = "return-original" },
  { key = "C-o", action = "toggle-tab" },
  { key = "TAB", action = "return-selection" },
  { key = "C-a", action = "enter-prefix-mode" },
  { key = "right", action = "cursor-right" },
  { key = "left", action = "cursor-left" },
  { key = "down", action = "select-next" },
  { key = "up", action = "select-previous" },
  { key = "BS", action = "delete-char-before" },
  { key = "RET", action = "accept" },
  { key = "C-m", action = "accept" },
  { key = "C-y", action = "copy" },
  { key = "C-left", action = "cursor-word-left" },
  { key = "M-b", action = "cursor-word-left" },
  { key = "C-b", action = "cursor-left" },
  { key = "C-right", action = "cursor-word-right" },
  { key = "M-f", action = "cursor-word-right" },
  { key = "C-f", action = "cursor-right" },
  { key = "home", action = "cursor-start" },
  { key = "C-e", action = "cursor-end" },
  { key = "end", action = "cursor-end" },
  { key = "C-BS", action = "delete-word-before" },
  { key = "M-BS", action = "delete-word-before" },
  { key = "C-h", action = "delete-char-before" },
  { key = "C-?", action = "delete-char-before" },
  { key = "C-delete", action = "delete-word-after" },
  { key = "M-d", action = "delete-word-after" },
  { key = "delete", action = "delete-char-after" },
  { key = "C-d", action = "delete-char-after" },
  { key = "C-w", action = "delete-to-word-boundary" },
  { key = "C-u", action = "clear-line" },
  { key = "C-r", action = "cycle-filter-mode" },
  { key = "C-s", action = "cycle-search-mode" },
  { key = "C-n", action = "select-next" },
  { key = "C-j", action = "select-next" },
  { key = "C-p", action = "select-previous" },
  { key = "C-k", action = "select-previous" },
  { key = "C-l", action = "redraw" },
  { key = "next", action = "scroll-page-down" },
  { key = "prior", action = "scroll-page-up" },
]

[[source]]
