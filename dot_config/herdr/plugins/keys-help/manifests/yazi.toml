# Манифест yazi (D6 и D9 изменения herdr-keys-help). Слой интерфейса сообщает поставщик
# в ~/.config/yazi/init.lua (запись `yazi-<pid>.json`, поле `mode` — родное имя слоя:
# mgr, tasks, spot, pick, input, confirm, cmp, help). Запуск не из оболочки виден по
# процессу переднего плана, запуск из оболочки — по записи `exec` (функция `y` из
# ~/.bashrc запускает yazi с --cwd-file).
#
# Таблица: умолчания выпуска 26.9.1 (файл data/yazi-keymap-26.9.1.toml — keymap-default.toml
# исходников, без правок) и поверх них ~/.config/yazi/keymap.toml (prepend_keymap перед
# умолчаниями, append_keymap после, keymap заменяет умолчания). Поле `desc` исходников и
# keymap.toml — полный текст (`desc_full`); короткие описания — в правилах [[describe]]
# ниже, по слою (`modes`, родное имя слоя) и действию (`run`; массив команд склеен через
# «; »). Пути без `~`, `/` и `{` — относительно каталога манифестов.

program = "yazi"
priority = 100
origins = ["yazi", "user"]

[detect]
provider = "yazi"
process = ["yazi"]
shell_commands = ["yazi", "yazi *", "y", "y *"]

[modes]
default = "mgr"
names = { mgr = "manager" }

[[source]]
modes = ["*"]
kind = "toml"
file = "data/yazi-keymap-26.9.1.toml"
tables = ["{mode}"]
arrays = ["keymap"]
key_field = "on"
action_field = "run"
desc_field = "desc"
origin = "yazi"

[[source]]
modes = ["*"]
kind = "toml"
file = "~/.config/yazi/keymap.toml"
tables = ["{mode}"]
arrays = ["prepend_keymap", "keymap", "append_keymap"]
key_field = "on"
action_field = "run"
desc_field = "desc"
replace_if = "keymap"
on_conflict = "override"
origin = "user"

