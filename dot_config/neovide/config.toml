wsl = false
multigrid = true
vsync = false
srgb = false
idle = true
frame = "none"
# Форк не включается: программы, вызывающие редактор (git, Claude Code по Ctrl-G), ждут завершения процесса; отрыв от терминала — флагом --fork там, где он нужен.
startup-message-capture = false

[font]
size = 16.00

[[font.normal]]
family = "IosevkaTermSlab NF"
style = "W200"

[[font.bold]]
family = "IosevkaTermSlab NF"
style = "W600"

[[font.italic]]
family = "IosevkaTermSlab NF"
style = "W200 Italic"

[[font.bold_italic]]
family = "IosevkaTermSlab NF"
style = "W600 Italic"

[box-drawing.sizes]
default = [1, 3]
