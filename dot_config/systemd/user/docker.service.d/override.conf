# Docker без root (docs/dev-stand.md монорепозитория monorepo-ocp,
# «Docker без root»): сеть pasta, порты публикует pesto — порт открывается
# сразу при запуске контейнера, в том числе из диапазона
# ip_local_port_range, который драйвер implicit не переносит.
[Service]
Environment="DOCKERD_ROOTLESS_ROOTLESSKIT_NET=pasta"
Environment="DOCKERD_ROOTLESS_ROOTLESSKIT_PORT_DRIVER=pesto"
# Контейнеры в сетях-мостах доходят до петли машины (ротатор номеров
# стенда шлёт оповещения QMS места, который слушает только 127.0.0.1).
Environment="DOCKERD_ROOTLESS_ROOTLESSKIT_DISABLE_HOST_LOOPBACK=false"
