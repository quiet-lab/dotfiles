# Пакет voxtype ставит /usr/bin/voxtype ссылкой на сборку без GPU
# (voxtype-native), а обновление пакета сбрасывает переключение
# `voxtype setup gpu --enable`. Демон запускает сборку с Vulkan напрямую,
# чтобы модель large-v3 работала на видеокарте, а не на процессоре.
# Пустой ExecStart= сбрасывает значение из юнита пакета.
[Service]
ExecStart=
ExecStart=/usr/lib/voxtype/voxtype-vulkan -q daemon
