# Экран блокировки: обои сессии с размытием и поле пароля. Цвета Tokyo Night.

general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/.wallpapers/mechanical/okita-souji_FHD.jpg
    blur_passes = 2
    blur_size = 6
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    outer_color = rgba(7aa2f7ee)
    inner_color = rgba(1a1b26ee)
    font_color = rgba(c0caf5ff)
    check_color = rgba(e0af68ee)
    fail_color = rgba(f7768eee)
    fade_on_empty = false
    placeholder_text = <i>Пароль</i>
    fail_text = <i>Неверный пароль ($ATTEMPTS)</i>
    rounding = 10
    position = 0, -80
    halign = center
    valign = center
}
