# Обои сессии Hyprland: файл унаследован от X11-сессии (набор
# cachyos-openbox-settings). Запуск: hyprpaper.service через
# graphical-session.target.

wallpaper {
    monitor = DP-2
    path = ~/.wallpapers/mechanical/okita-souji_FHD.jpg
    fit_mode = cover
}

# Запасной вариант для любого другого монитора.
wallpaper {
    monitor =
    path = ~/.wallpapers/mechanical/okita-souji_FHD.jpg
    fit_mode = cover
}

splash = false
