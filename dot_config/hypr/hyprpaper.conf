# Обои сессии Hyprland: тот же файл, что сохранён для nitrogen в X11-сессии
# (~/.config/nitrogen/bg-saved.cfg). Запуск: hyprpaper.service через
# graphical-session.target.

wallpaper {
    monitor = DP-2
    path = ~/.wallpapers/mechanical/okita-souji_FHD.jpg
    fit_mode = cover
}

# Запасной вариант для любого другого монитора.
wallpaper {
    monitor =
    path = ~/.wallpapers/mechanical/okita-souji_FHD.jpg
    fit_mode = cover
}

splash = false
