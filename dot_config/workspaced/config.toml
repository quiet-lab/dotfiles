# Конфиг демона workspaced (спецификация ws-config).
# Демон пишет сюда только по команде записи workspace в конфиг
# (CTRL+SUPER+s CTRL+SUPER+w). Сохранение сессии (CTRL+SUPER+s CTRL+SUPER+s)
# этот файл не трогает.
# Координаты — от левого верхнего угла экрана 3840×2160; панель занимает
# 330 px слева. Число — пиксели, строка с процентом — доля монитора.
# Координаты могут быть отрицательными, а размеры больше экрана: окно тогда
# выходит за край, например { x = -400, y = 0, w = 4600, h = "100%" }.
# Ячейки шаблонов и rect приложений — это положение и размер окна на экране
# как есть: демон ничего не прибавляет и не вычитает.

# Правило: расстояние от края экрана и панели до окна, между окнами и между
# плитками панели — одно число, 10 px. Поэтому ячейки заложены с этим отступом
# (x от 340, y от 10, до 3830 и 2150), а панель держит те же 10 px
# (Theme.margin и Theme.gap в quickshell/panel/Theme.qml). Зазор gap нужен
# только командам `half` (Alt+Super+стрелки), `place` и `maximize`: они
# считают половины, позиции и развёрнутую область от рабочей области по тому
# же правилу, отступ 2·gap = 10 px.
gap = 5

# Общее окружение для всех приложений; переопределяется в workspace и приложении.
[env]
EDITOR = "neovide"

# Служебные цепочки. Super+Tab — префикс действий с workspace (после него
# Super отпускается): w/s — поднять, Tab — следующий workspace стола.
# Ctrl+Super+S — префикс сохранения; чем цепочка кончается, то и сохраняется:
#   Ctrl+Super+S — сессия: посторонние окна стола входят в активный workspace
#     этого стола как дополнительные приложения сессии, файл не меняется;
#   Ctrl+Super+W — workspace целиком записывается в этот файл вместе
#     с дополнительными приложениями сессии.
[keys]
save_session = "CTRL+SUPER+s CTRL+SUPER+s"
save_workspace = "CTRL+SUPER+s CTRL+SUPER+w"
sessions = "SUPER+S"
next_workspace = "SUPER+TAB Tab"
# Сочетания, которые не может занять ни одна привязка; `workspaced check`
# отклоняет конфиг с такой привязкой (спецификация hyprland-binds).
# Карта XKB (~/.config/X11/xkb_custom): Super+Пробел, Alt+Super+E,
# Alt+Super+R — иначе композитор перехватит их раньше XKB.
# Намеренно свободное: Alt+Super+Пробел.
reserved = ["SUPER+space", "ALT+SUPER+E", "ALT+SUPER+R", "ALT+SUPER+space"]

# ---- Шаблоны геометрии --------------------------------------------------

# Две колонки, главная справа.
[templates.halves]
main = "right"
[templates.halves.cells]
left = { x = 340, y = 10, w = 1740, h = 2140 }
right = { x = 2090, y = 10, w = 1740, h = 2140 }

# Три окна по 1920 px на всю высоту: главное по центру рабочей области
# (330…3840, центр 2085), боковые слева и справа от него с отступом 10 px
# уходят за края экрана на 805 px.
[templates.thirds]
main = "center"
[templates.thirds.cells]
left = { x = -805, y = 10, w = 1920, h = 2140 }
center = { x = 1125, y = 10, w = 1920, h = 2140 }
right = { x = 3055, y = 10, w = 1920, h = 2140 }

# Три окна по 1920 px на всю высоту поверх друг друга: левое от панели
# (340…2260), правое до края экрана (1910…3830), главное по центру рабочей
# области (центр 2085, окно 1125…3045) перекрывает оба.
[templates.overlay]
main = "center"
[templates.overlay.cells]
left = { x = 340, y = 10, w = 1920, h = 2140 }
center = { x = 1125, y = 10, w = 1920, h = 2140 }
right = { x = 1910, y = 10, w = 1920, h = 2140 }

# Крест: колонки по краям, центр разбит на верх, середину (главная) и низ.
[templates.cross]
main = "center"
[templates.cross.cells]
left = { x = 340, y = 10, w = 690, h = 2140 }
top = { x = 1040, y = 10, w = 2090, h = 590 }
center = { x = 1040, y = 610, w = 2090, h = 940 }
bottom = { x = 1040, y = 1560, w = 2090, h = 590 }
right = { x = 3140, y = 10, w = 690, h = 2140 }

# ---- Приложения ---------------------------------------------------------
# У приложения может быть несколько окон — экземпляров; окно помечается тегом
# app:<имя>#<номер>. class и title — регулярные выражения: при поднятии
# workspace и по цепочке демон захватывает все подходящие открытые окна с таким
# классом (целиком) и заголовком, где бы они ни были, и нового окна не открывает.
# Поле family делает приложение вариантом семейства: окно варианта считается
# и окном семейства, а окно, подходящее обоим, достаётся варианту. У семейства,
# которое только собирает окна, поле cmd можно не задавать.
# Цепочка из одного сочетания — прямая привязка Super+буква.

# Семейство wezterm — обычные окна терминала. Ни в один workspace не входит
# и клавиши не имеет: иначе Super+T действовал бы на все окна wezterm, включая
# терминал, из которого работает пользователь. Запись нужна, чтобы у herdr
# было семейство.
[apps.wezterm]
cmd = "wezterm-gui"
class = "^org\\.wezfurlong\\.wezterm$"

# Терминал wezterm с herdr — вариант семейства wezterm. Окно опознаётся
# собственным классом: ключ --class меняет app_id у всех окон этого экземпляра
# wezterm, а заголовок задаёт программа внутри терминала и меняет его по ходу
# работы.
# --always-new-process: отдельный процесс, иначе окно откроется внутри уже
# работающего wezterm.
[apps.herdr]
family = "wezterm"
chain = "SUPER+T"
cmd = "wezterm-gui"
args = ["start", "--always-new-process", "--class", "wezterm-herdr", "--", "herdr"]
cwd = "~"
class = "^wezterm-herdr$"

# Chromium нативно под Wayland (~/.config/chromium-flags.conf), класс chromium;
# под Xwayland был Chromium-browser.
[apps.chromium]
chain = "SUPER+C"
cmd = "chromium"
class = "(?i)^chromium(-browser)?$"

[apps.neovide]
chain = "SUPER+E"
cmd = "neovide"
class = "^neovide$"

# Google Chrome из контейнера distrobox fedora-box (Fedora, флаг --nvidia: GPU,
# драйвер VA-API NVIDIA и звук проброшены с хоста), нативно под Wayland
# (под Xwayland voxtype печатал в него цифры вместо текста). Аппаратное
# декодирование видео Chromium под Wayland включает только по флагу
# --enable-features (AcceleratedVideoDecodeLinuxGL, VaapiOnNvidiaGPUs), без него
# 4K на YouTube идёт рывками; переменные NVIDIA приходят из окружения сессии.
# Два профиля — два отдельных экземпляра Chrome: chrome работает с каталогом
# данных по умолчанию ~/.config/google-chrome (профиль Default, Alexandr),
# chrome-ai — с каталогом ~/.config/google-chrome-ai (профиль AI.dev2026)
# и собственным классом окна google-chrome-ai. Класс задаёт ключ --class,
# его получают и окна, открытые по Ctrl+N, поэтому окна профилей различаются
# по классу. Каталог в аргументе пишется через $HOME: `~` демон подставляет
# только в начале строки.
[apps.chrome]
chain = "SUPER+B"
cmd = "distrobox-enter"
args = [
  "-n",
  "fedora-box",
  "--",
  "/usr/bin/google-chrome-stable",
  "--ozone-platform=wayland",
  "--enable-features=AcceleratedVideoDecodeLinuxGL,VaapiOnNvidiaGPUs,VaapiIgnoreDriverChecks",
  "--profile-directory=Default",
]
class = "(?i)^google-chrome$"

[apps.chrome-ai]
chain = "SUPER+V"
cmd = "distrobox-enter"
args = [
  "-n",
  "fedora-box",
  "--",
  "/usr/bin/google-chrome-stable",
  "--ozone-platform=wayland",
  "--enable-features=AcceleratedVideoDecodeLinuxGL,VaapiOnNvidiaGPUs,VaapiIgnoreDriverChecks",
  "--user-data-dir=$HOME/.config/google-chrome-ai",
  "--profile-directory=Default",
  "--class=google-chrome-ai",
]
class = "(?i)^google-chrome-ai$"

# Яндекс.Браузер из того же контейнера с теми же флагами, профиль Default; попал в surf командой
# сохранения. Команда записана вручную: демон взял её из /proc процесса в
# контейнере (/opt/yandex/browser/yandex_browser), на хосте такого пути нет.
[apps.yandex-browser]
chain = "SUPER+Y"
cmd = "distrobox-enter"
args = [
  "-n",
  "fedora-box",
  "--",
  "/usr/bin/yandex-browser-stable",
  "--ozone-platform=wayland",
  "--enable-features=AcceleratedVideoDecodeLinuxGL,VaapiOnNvidiaGPUs,VaapiIgnoreDriverChecks",
  "--profile-directory=Default",
]
class = "(?i)^yandex-browser$"

# ---- Workspace ----------------------------------------------------------

# Рабочий workspace: herdr по центру (главный), Chromium слева, neovide
# справа на шаблоне thirds.
[workspaces.work]
chain = "SUPER+TAB w"
template = "thirds"
main = "herdr"
icon = "folder-development"
[workspaces.work.apps]
herdr = "center"
chromium = "left"
neovide = "right"

# Браузеры на шаблоне overlay: Яндекс.Браузер по центру (главный), Chrome
# профиля Default слева, AI.dev2026 справа. Живёт на столе 2.
[workspaces.surf]
chain = "SUPER+TAB s"
template = "overlay"
main = "yandex-browser"
icon = "yandex-browser"
[workspaces.surf.apps]
chrome = "left"
yandex-browser = "center"
chrome-ai = "right"

# Поднимается при старте демона после восстановления сессии (стол 1).
[startup]
workspace = "work"

# ---- Горячие клавиши сессии ---------------------------------------------
# Все привязки Hyprland живут здесь (спецификация hyprland-binds): hyprland.lua
# только загружает код, который печатает `workspaced keys --lua`. Одиночное
# сочетание — прямая привязка, цепочка через пробел — подкарта. Ровно одно
# действие на запись: action (демон), exec (команда), dispatch (диспетчер
# hl.dsp.* без префикса, строка или список по порядку), lua (тело функции).
# Флаги: locked (и при заблокированном экране), repeating (повтор при
# удержании), mouse (кнопка мыши с удержанием), release (по отпусканию).
# range = [от, до] разворачивает запись, $n заменяется числом.
# Список привязок — `workspaced keys --list`.

# Программы.
[[binds]]
chain = "SUPER+R"
exec = "rofi -show drun"

# Меню буфера обмена: история cliphist через rofi. Super+V отдан Chrome,
# Insert — клавиша вставки.
[[binds]]
chain = "SUPER+Insert"
exec = "~/.local/bin/handmade-scripts/clipboard-menu"

# Окно. Закрытие — Super+Delete: Super+C занят Chromium.
[[binds]]
chain = "SUPER+Delete"
dispatch = "window.close()"

# Замена сворачивания: Super+Z прячет окно в специальный стол «hidden»,
# Super+Shift+Z показывает и скрывает этот стол.
[[binds]]
chain = "SUPER+Z"
dispatch = "window.move({ workspace = \"special:hidden\", follow = false })"

[[binds]]
chain = "SUPER+SHIFT+Z"
dispatch = "workspace.toggle_special(\"hidden\")"

# Фокус.
[[binds]]
chain = "SUPER+left"
dispatch = "focus({ direction = \"l\" })"

[[binds]]
chain = "SUPER+right"
dispatch = "focus({ direction = \"r\" })"

[[binds]]
chain = "SUPER+up"
dispatch = "focus({ direction = \"u\" })"

[[binds]]
chain = "SUPER+down"
dispatch = "focus({ direction = \"d\" })"

# Alt+Tab с подъёмом окна наверх, как NextWindow в Openbox. Диспетчер
# cycle_next обходит окна в порядке слоёв, а bring_to_top этот порядок меняет,
# поэтому назад он ходил только между двумя последними окнами. Здесь обход
# идёт по порядку создания окон (stable_id) среди окон текущего стола.
[[binds]]
chain = "ALT+Tab"
lua = """
local cur = hl.get_active_window()
if not cur or not cur.workspace then return end
local list = {}
for _, w in ipairs(hl.get_windows()) do
  if w.mapped and w.workspace and w.workspace.id == cur.workspace.id then table.insert(list, w) end
end
table.sort(list, function(a, b) return a.stable_id < b.stable_id end)
local idx = 1
for i, w in ipairs(list) do if w.address == cur.address then idx = i end end
hl.dispatch(hl.dsp.focus({ window = list[(idx) % #list + 1] }))
hl.dispatch(hl.dsp.window.bring_to_top())
"""

[[binds]]
chain = "ALT+SHIFT+Tab"
lua = """
local cur = hl.get_active_window()
if not cur or not cur.workspace then return end
local list = {}
for _, w in ipairs(hl.get_windows()) do
  if w.mapped and w.workspace and w.workspace.id == cur.workspace.id then table.insert(list, w) end
end
table.sort(list, function(a, b) return a.stable_id < b.stable_id end)
local idx = 1
for i, w in ipairs(list) do if w.address == cur.address then idx = i end end
hl.dispatch(hl.dsp.focus({ window = list[(idx - 2) % #list + 1] }))
hl.dispatch(hl.dsp.window.bring_to_top())
"""

# Геометрия окна — слой Alt+Super. Половины рабочей области: команда демона
# `half`, отступы по правилу gap выше. Super+Shift+стрелки намеренно свободны.
[[binds]]
chain = "ALT+SUPER+left"
action = { half = "left" }

[[binds]]
chain = "ALT+SUPER+right"
action = { half = "right" }

[[binds]]
chain = "ALT+SUPER+up"
action = { half = "up" }

[[binds]]
chain = "ALT+SUPER+down"
action = { half = "down" }

# Позиции окна: команда демона `place`, те же отступы. Верхний ряд (окно в
# половину ширины и высоты): Home — слева, PageDown — по центру, End — справа.
# Нижний ряд с Ctrl: Z — слева, X — по центру, V — справа. C с Ctrl — по центру
# на всю высоту, PageUp — развернуть с возвратом (maximize), Enter — окно 1920×1080 по центру
# рабочей области (размер Full HD), Menu — полноэкранный режим.
[[binds]]
chain = "ALT+SUPER+Home"
action = { place = "top-left" }

[[binds]]
chain = "ALT+SUPER+Page_Down"
action = { place = "top-center" }

[[binds]]
chain = "ALT+SUPER+End"
action = { place = "top-right" }

[[binds]]
chain = "CTRL+ALT+SUPER+Z"
action = { place = "bottom-left" }

[[binds]]
chain = "CTRL+ALT+SUPER+X"
action = { place = "bottom-center" }

[[binds]]
chain = "CTRL+ALT+SUPER+V"
action = { place = "bottom-right" }

[[binds]]
chain = "CTRL+ALT+SUPER+C"
action = { place = "center" }

# Развёртывание — командой демона, а не режимом maximized композитора: Hyprland
# ставит плавающее окно вплотную к панели и краям, демон оставляет те же 10 px,
# что у половин и ячеек (2·gap). Повторное нажатие возвращает прежнюю геометрию.
[[binds]]
chain = "ALT+SUPER+Page_Up"
action = "maximize"

[[binds]]
chain = "ALT+SUPER+Return"
dispatch = [
  "window.float({ action = \"on\" })",
  "window.resize({ x = 1920, y = 1080, relative = false })",
  "window.center()",
]

[[binds]]
chain = "ALT+SUPER+Menu"
dispatch = "window.fullscreen({ mode = \"fullscreen\", action = \"toggle\" })"

# Рабочие столы: переход и перенос окна с переходом за ним (SendToDesktop).
[[binds]]
chain = "SUPER+$n"
range = [1, 8]
dispatch = "focus({ workspace = $n })"

[[binds]]
chain = "SUPER+SHIFT+$n"
range = [1, 8]
dispatch = "window.move({ workspace = $n, follow = true })"

# Мышь: перемещение и изменение размера с удержанием Super.
[[binds]]
chain = "SUPER+mouse:272"
mouse = true
dispatch = "window.drag()"

[[binds]]
chain = "SUPER+mouse:273"
mouse = true
dispatch = "window.resize()"

# Блокировка сессии: hypridle слушает logind и запускает hyprlock.
[[binds]]
chain = "SUPER+L"
exec = "loginctl --no-ask-password lock-session"

# Скриншоты (grim и slurp, см. ~/.local/bin/handmade-scripts).
[[binds]]
chain = "Print"
exec = "~/.local/bin/handmade-scripts/screenshot-screen"

[[binds]]
chain = "CTRL+Print"
exec = "~/.local/bin/handmade-scripts/screenshot-countdown"

[[binds]]
chain = "SHIFT+Print"
exec = "~/.local/bin/handmade-scripts/screenshot-selection"

# Уведомления dunst.
[[binds]]
chain = "CTRL+Escape"
exec = "dunstctl history-pop"

[[binds]]
chain = "CTRL+Return"
exec = "dunstctl context"

[[binds]]
chain = "CTRL+space"
exec = "dunstctl close"

[[binds]]
chain = "CTRL+SHIFT+space"
exec = "dunstctl close-all"

# Мультимедиа: работают и при заблокированном экране.
[[binds]]
chain = "XF86AudioRaiseVolume"
exec = "~/.local/bin/handmade-scripts/change-volume.sh +"
locked = true
repeating = true

[[binds]]
chain = "XF86AudioLowerVolume"
exec = "~/.local/bin/handmade-scripts/change-volume.sh -"
locked = true
repeating = true

[[binds]]
chain = "XF86AudioMute"
exec = "~/.local/bin/handmade-scripts/change-volume.sh 0"
locked = true

[[binds]]
chain = "XF86MonBrightnessUp"
exec = "~/.local/bin/handmade-scripts/change-brightness.sh +"
locked = true
repeating = true

[[binds]]
chain = "XF86MonBrightnessDown"
exec = "~/.local/bin/handmade-scripts/change-brightness.sh -"
locked = true
repeating = true

[[binds]]
chain = "XF86AudioPlay"
exec = "playerctl play-pause"
locked = true

[[binds]]
chain = "XF86AudioStop"
exec = "playerctl stop"
locked = true

[[binds]]
chain = "XF86AudioPrev"
exec = "playerctl previous"
locked = true

[[binds]]
chain = "XF86AudioNext"
exec = "playerctl next"
locked = true

# Служебные привязки, которых в Openbox не было.
# Выход из сессии, пока нет плитки питания: сочетание с тремя модификаторами,
# чтобы не нажать случайно.
[[binds]]
chain = "CTRL+ALT+SUPER+Escape"
dispatch = "exit()"
