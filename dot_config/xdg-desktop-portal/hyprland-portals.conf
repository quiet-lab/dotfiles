# Выбор бэкендов xdg-desktop-portal для сессии Hyprland (XDG_CURRENT_DESKTOP=Hyprland).
# Файл в ~/.config имеет приоритет над /usr/share/xdg-desktop-portal/hyprland-portals.conf.
# Скриншоты, захват экрана и глобальные сочетания — hyprland, остальное — gtk,
# выбор файла — yazi в окне wezterm через xdg-desktop-portal-termfilechooser (AUR).
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.FileChooser=termfilechooser
