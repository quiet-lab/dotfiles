# User's picom configuration.
# https://github.com/owl4ce/dotfiles

# SHADOWS
# ---
# Enabled client-side shadows on windows.
shadow = true;
# The blur radius for shadows, in pixels.
shadow-radius = 40;
# The opacity of shadows.
shadow-opacity = 0.1;
# The left offset for shadows, in pixels.
shadow-offset-x = -27;
# The top offset for shadows, in pixels.
shadow-offset-y = -27;
# Окна без тени задаются в разделе WINDOW RULES ниже.
# Обрезать тень окна по границе монитора, на котором оно находится.
crop-shadow-to-monitor = true;

# FADING
# ---
# Fade windows in/out when opening/closing and when opacity changes.
fading = true;
# Opacity change between steps while fading in.
fade-in-step = 0.025;
# Opacity change between steps while fading out.
fade-out-step = 0.025;
# The time between steps in fade step, in milliseconds.
fade-delta = 4;
# Do not fade destroyed ARGB windows with WM frame.
# Workaround of bugs in Openbox, Fluxbox, etc.
no-fading-destroyed-argb = true;

# CORNERS
# ---
# Радиус скругления углов окон. Окна без скругления задаются в WINDOW RULES.
corner-radius = 8;

# OPACITY
# ---
# Прозрачность рамок окон (заголовки Openbox).
frame-opacity = 1.0;
# Прозрачность окон задаётся в WINDOW RULES.

# BACKGROUND BLURRING
# ---
# Параметры размытия фона. Какие окна размывать — в WINDOW RULES.
blur: {
  method = "gaussian";
  size = 25;      # Радиус (от 3 до 50)
  deviation = 5.0; # Стандартное отклонение (интенсивность)
}

# GENERAL
# ---
# Specify the backend to use: `xrender`, `glx`, or `xr_glx_hybrid`.
backend = "glx";
# Enable or disable VSync.
vsync = true;
# Try to detect windows with rounded corners and don't consider them shaped windows.
detect-rounded-corners = true;
# Detect '_NET_WM_WINDOW_OPACITY' on client windows,
# useful for window managers not passing '_NET_WM_WINDOW_OPACITY' of client windows to frame windows.
detect-client-opacity = true;
# Use EWMH '_NET_ACTIVE_WINDOW' to determine currently focused window,
# rather than listening to 'FocusIn'/'FocusOut' event.
# Might have more accuracy, provided that the WM supports it.
use-ewmh-active-win = true;
# Unredirect all windows if a full-screen opaque window is detected,
# to maximize performance for full-screen windows.
# Known to cause flickering when redirecting/unredirecting windows.
unredir-if-possible = false;
# Use 'WM_TRANSIENT_FOR' to group windows,
# and consider windows in the same group focused at the same time.
detect-transient = true;
# Use 'WM_CLIENT_LEADER' to group windows, and consider windows in the same group focused at the same time.
# This usually means windows from the same application will be considered focused or unfocused at the same time.
# 'WM_TRANSIENT_FOR' has higher priority if detect-transient is enabled, too.
detect-client-leader = true;
# Use X Sync fence to sync clients' draw calls,
# to make sure all draw calls are finished before picom starts drawing.
# Needed on nvidia-drivers with GLX backend for some users.
xrender-sync-fence = true;
# Set the log level.
# Possible values are: "trace", "debug", "info", "warn", "error" in increasing level of importance.
# Case doesn't matter. If using the "TRACE" log level, it's better to log into a file using *--log-file*,
# since it can generate a huge stream of logs.
log-level = "warn";
# Set the log file.
# If *--log-file* is never specified, logs will be written to stderr.
# Otherwise, logs will to written to the given file,
# though some of the early logs might still be written to the stderr.
# When setting this option from the config file, it is recommended to use an absolute path.
log-file = "/dev/null"

# WINDOW RULES
# ---
# Единый список правил для окон (picom ≥ 12). Правила применяются по порядку,
# при совпадении нескольких последнее значение опции побеждает.
# В этом режиме старые опции opacity-rule, blur-background-exclude,
# shadow-exclude, rounded-corners-exclude, inactive-opacity и wintypes
# не действуют, поэтому все они перенесены сюда.
rules = (
    # Значения по умолчанию для всех окон.
    { shadow = true; fade = true; blur-background = false; },

    # Типы окон (бывший блок wintypes).
    { match = "window_type = 'tooltip' || window_type = 'menu' || window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'utility' || window_type = 'dialog' || window_type = 'notification' || window_type = 'unknown'";
      opacity = 1.0; },
    { match = "window_type = 'dock'"; shadow = false; clip-shadow-above = true; corner-radius = 0; },
    { match = "window_type = 'dnd'"; shadow = false; },
    { match = "window_type = 'desktop'"; corner-radius = 0; },

    # Окна без тени и без скругления углов.
    { match = "class_g = 'Conky' || class_g = 'GLava'"; shadow = false; corner-radius = 0; },
    { match = "class_g ?= 'Notify-osd'"; shadow = false; },
    { match = "name *= 'rofi' || name *= 'screenkey' || name *= 'tint2'"; corner-radius = 0; },
    # Свёрнутые окна и окна с клиентской рамкой GTK (невидимые поля под тень).
    { match = "_NET_WM_STATE@ *= '_NET_WM_STATE_HIDDEN'"; shadow = false; corner-radius = 0; },
    { match = "_GTK_FRAME_EXTENTS@"; shadow = false; corner-radius = 0; },
    # Полноэкранные окна без скругления (старое поведение picom).
    { match = "fullscreen"; corner-radius = 0; },

    # Окна, которые вне фокуса становятся полупрозрачными и размывают фон.
    # Список классов задаётся здесь один раз, по одному на строку: libconfig
    # склеивает соседние строки в одну, как в C. У каждого класса, кроме
    # последнего, в конце стоит «|». group_focused нужен, чтобы окно
    # оставалось непрозрачным, пока фокус в его диалоге или дочернем окне.
    { match = "class_g ~= '^("
              "org.wezfurlong.wezterm|"
              "Alacritty|"
              "neovide|"
              "pavucontrol|"
              "steam|"
              "TelegramDesktop|"
              "Thunar|"
              "firefox|"
              "Yandex-browser|"
              "Google-chrome|"
              "Chromium"
              ")$' && !(focused || group_focused)";
      opacity = 0.7; blur-background = true; },

    # Окна eww: каждая плитка дашборда — отдельное окно, залитое чёрным
    # с alpha 0.7 в eww.scss. picom размывает фон под каждым окном и
    # скругляет его по радиусу плитки (12px), чтобы размытие не выступало
    # из-под скруглённых углов. Промежутки между плитками окнам не
    # принадлежат и потому не размываются.
    { match = "class_g ?= 'eww'"; blur-background = true; corner-radius = 12; },
    # Всплывающие меню и подсказки eww (DBusMenu трея): окно без альфа-канала,
    # углы срезаются здесь тем же радиусом, что у рамки меню в eww.scss.
    { match = "class_g ?= 'eww' && (window_type = 'popup_menu' || window_type = 'menu' || window_type = 'tooltip')"; corner-radius = 8; blur-background = false; },
)
