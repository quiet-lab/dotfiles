# Конфигурация picom.
# За основу взяты dotfiles https://github.com/owl4ce/dotfiles

# ТЕНИ
# ---
# Тени окон, рисуемые композитором.
shadow = true;
# Радиус размытия тени, в пикселях.
shadow-radius = 40;
# Непрозрачность тени.
shadow-opacity = 0.1;
# Смещение тени по горизонтали, в пикселях.
shadow-offset-x = -27;
# Смещение тени по вертикали, в пикселях.
shadow-offset-y = -27;
# Окна без тени задаются в разделе «ПРАВИЛА ДЛЯ ОКОН» ниже.
# Обрезать тень окна по границе монитора, на котором оно находится.
crop-shadow-to-monitor = true;

# ЗАТУХАНИЕ
# ---
# Плавное появление и исчезновение окон при открытии, закрытии и смене прозрачности.
fading = true;
# Шаг изменения прозрачности при появлении окна.
fade-in-step = 0.025;
# Шаг изменения прозрачности при исчезновении окна.
fade-out-step = 0.025;
# Интервал между шагами затухания, в миллисекундах.
fade-delta = 4;
# Не применять затухание к закрытым ARGB-окнам с рамкой оконного менеджера.
# Обход ошибок в Openbox, Fluxbox и других.
no-fading-destroyed-argb = true;

# УГЛЫ
# ---
# Радиус скругления углов окон. Окна без скругления задаются в «ПРАВИЛА ДЛЯ ОКОН».
corner-radius = 8;

# ПРОЗРАЧНОСТЬ
# ---
# Прозрачность рамок окон (заголовки Openbox).
frame-opacity = 1.0;
# Прозрачность окон задаётся в «ПРАВИЛА ДЛЯ ОКОН».

# РАЗМЫТИЕ ФОНА
# ---
# Параметры размытия фона. Какие окна размывать — в «ПРАВИЛА ДЛЯ ОКОН».
# dual_kawase заметно дешевле для GPU, чем gaussian с радиусом 25 на 3840×2160:
# первый кадр после смены рабочего стола приходит на 10–20 мс раньше.
blur: {
  method = "dual_kawase";
  strength = 1.3;   # Сила размытия (от 1 до 20)
}


# ОБЩИЕ ПАРАМЕТРЫ
# ---
# Бэкенд отрисовки: `xrender`, `glx` или `xr_glx_hybrid`.
backend = "glx";
# Вертикальная синхронизация.
vsync = true;
# Распознавать окна со скруглёнными углами и не считать их окнами произвольной формы.
detect-rounded-corners = true;
# Читать '_NET_WM_WINDOW_OPACITY' с клиентских окон: нужно оконным менеджерам,
# которые не переносят это свойство с клиентского окна на окно рамки.
detect-client-opacity = true;
# Определять активное окно по EWMH-свойству '_NET_ACTIVE_WINDOW',
# а не по событиям 'FocusIn'/'FocusOut'.
# Точнее, если оконный менеджер это поддерживает.
use-ewmh-active-win = true;
# Отключать композитинг, когда на экране непрозрачное полноэкранное окно,
# ради максимальной производительности полноэкранных приложений.
# Известно, что переключение режима вызывает мерцание.
unredir-if-possible = false;
# Группировать окна по 'WM_TRANSIENT_FOR' и считать окна одной группы
# сфокусированными одновременно.
detect-transient = true;
# Группировать окна по 'WM_CLIENT_LEADER' и считать окна одной группы
# сфокусированными одновременно. Обычно это означает, что все окна одного
# приложения получают и теряют фокус вместе.
# При включённом detect-transient приоритет у 'WM_TRANSIENT_FOR'.
detect-client-leader = true;
# Синхронизировать отрисовку клиентов через X Sync fence, чтобы все их вызовы
# завершились до того, как picom начнёт рисовать кадр.
# Части пользователей нужно на драйверах nvidia с бэкендом GLX.
xrender-sync-fence = true;
# Уровень журналирования.
# Возможные значения по возрастанию важности: "trace", "debug", "info", "warn", "error".
# Регистр не важен. На уровне "trace" лучше писать в файл через *--log-file*,
# поскольку поток сообщений получается огромным.
log-level = "warn";
# Файл журнала.
# Если *--log-file* не задан, журнал идёт в stderr. Иначе сообщения пишутся
# в указанный файл, хотя самые первые могут всё же попасть в stderr.
# В конфигурационном файле рекомендуется указывать абсолютный путь.
log-file = "/dev/null"

# ПРАВИЛА ДЛЯ ОКОН
# ---
# Единый список правил для окон (picom ≥ 12). Правила применяются по порядку,
# при совпадении нескольких последнее значение опции побеждает.
# В этом режиме старые опции opacity-rule, blur-background-exclude,
# shadow-exclude, rounded-corners-exclude, inactive-opacity и wintypes
# не действуют, поэтому все они перенесены сюда.
rules = (
    # Значения по умолчанию для всех окон.
    { shadow = true; fade = true; blur-background = false; },

    # Типы окон (бывший блок wintypes).
    { match = "window_type = 'tooltip' || window_type = 'menu' || window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'utility' || window_type = 'dialog' || window_type = 'notification' || window_type = 'unknown'";
      opacity = 1.0; },
    { match = "window_type = 'dock'"; shadow = false; clip-shadow-above = true; corner-radius = 0; },
    { match = "window_type = 'dnd'"; shadow = false; },
    { match = "window_type = 'desktop'"; corner-radius = 0; },

    # Окна без тени и без скругления углов.
    { match = "class_g = 'Conky' || class_g = 'GLava'"; shadow = false; corner-radius = 0; },
    { match = "class_g ?= 'Notify-osd'"; shadow = false; },
    { match = "name *= 'rofi' || name *= 'screenkey' || name *= 'tint2'"; corner-radius = 0; },
    # Свёрнутые окна и окна с клиентской рамкой GTK (невидимые поля под тень).
    { match = "_NET_WM_STATE@ *= '_NET_WM_STATE_HIDDEN'"; shadow = false; corner-radius = 0; },
    { match = "_GTK_FRAME_EXTENTS@"; shadow = false; corner-radius = 0; },
    # Полноэкранные окна без скругления (старое поведение picom).
    { match = "fullscreen"; corner-radius = 0; },

    # Окна, которые вне фокуса становятся полупрозрачными и размывают фон.
    # Список классов задаётся здесь один раз, по одному на строку: libconfig
    # склеивает соседние строки в одну, как в C. У каждого класса, кроме
    # последнего, в конце стоит «|». group_focused нужен, чтобы окно
    # оставалось непрозрачным, пока фокус в его диалоге или дочернем окне.
    { match = "class_g ~= '^("
              "org.wezfurlong.wezterm|"
              "Alacritty|"
              "neovide|"
              "pavucontrol|"
              "steam|"
              "TelegramDesktop|"
              "Thunar|"
              "firefox|"
              "Yandex-browser|"
              "Google-chrome|"
              "Chromium"
              ")$' && !(focused || group_focused)";
      opacity = 0.7; blur-background = true; },

    # Окна eww: каждая плитка дашборда — отдельное окно, залитое чёрным
    # с alpha 0.7 в eww.scss. picom размывает фон под каждым окном и
    # скругляет его по радиусу плитки (12px), чтобы размытие не выступало
    # из-под скруглённых углов. Промежутки между плитками окнам не
    # принадлежат и потому не размываются.
    { match = "class_g ?= 'eww'"; blur-background = true; corner-radius = 12; },
    # Всплывающие меню и подсказки eww (DBusMenu трея): углы срезаются тем же
    # радиусом 8px, что у рамки меню в eww.scss; фон под меню размывается,
    # как под плитками (окно меню получает RGBA-визуал в сборке eww).
    { match = "class_g ?= 'eww' && (window_type = 'popup_menu' || window_type = 'menu' || window_type = 'tooltip')"; corner-radius = 8; blur-background = true; },
    # Инфопопапы и контекстное меню окна (окна eww hoverinfo/winmenu) демон
    # переоткрывает при переходе между иконками; без затухания старое окно
    # не просвечивает сквозь новое.
    { match = "class_g ?= 'eww' && (name = 'Eww - hoverinfo' || name = 'Eww - winmenu')"; fade = false; },
)
